name: Geometric Weather CI

on:
  push:
    branches: [ master, dev, feature/open-meteo ]
    paths-ignore:
      - ".editorconfig"
      - "fastlane/*"
      - "release/*"
      - "work/*"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew :app:assembleFdroidDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: geometric-weather-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 35
            platform: 35
            image: 35
            target: google_apis
            channel: stable
          - api: 36
            platform: 36
            image: 36
            target: google_apis
            channel: stable
          - api: 37
            platform: 36
            image: '37.2'
            target: google_apis_ps16k
            channel: canary
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geometric-weather-fdroid-debug
          path: apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update command-line tools for Android 17
        if: matrix.api == 37
        run: |
          tools="$ANDROID_HOME/cmdline-tools"
          "$tools/latest/bin/sdkmanager" --install "cmdline-tools;22.0"
          mv "$tools/latest" "$tools/preinstalled"
          ln -s 22.0 "$tools/latest"
          "$tools/latest/bin/avdmanager" list device > /dev/null
      - name: Install and launch on Android API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform }}
          system-image-api-level: ${{ matrix.image }}
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel }}
          arch: x86_64
          disable-animations: true
          ram-size: 4096M
          script: |
            adb install apk/*.apk
            adb logcat -b crash -c
            adb shell am start -W -n wangdaye.com.geometricweather/.main.MainActivity | tee launch.txt
            grep -q '^Status: ok' launch.txt
            adb shell pidof wangdaye.com.geometricweather
            adb logcat -b crash -d | tee crash.txt
            if grep -q 'Process: wangdaye.com.geometricweather' crash.txt; then exit 1; fi
