name: Geometric Weather CI

on:
  push:
    branches: [ master, dev, feature/open-meteo ]
    paths-ignore:
      - ".editorconfig"
      - "fastlane/*"
      - "release/*"
      - "work/*"
      - "LICENSE"
      - "README.md"
  workflow_dispatch:
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: gradle
      - name: Install Android SDK
        run: sdkmanager "platforms;android-32"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew :app:assembleFdroidDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: geometric-weather-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
